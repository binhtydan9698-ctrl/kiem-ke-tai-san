<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiểm kê tài sản FPTU ĐN</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<!-- Dữ liệu chung khi chạy trên web: Supabase (cấu hình trong config.js) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supabase-db.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar + one working column; tablet-landscape first, rows collapse to cards on narrow screens */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e9eeec; --line:#d5dcd9; --fg:#16201c; --muted:#5a6964;
  --accent:#0e5a4b; --accent-fg:#ffffff; --accent-soft:#d8ebe5;
  --ok:#1b7443; --ok-soft:#dcf0e3; --warn:#9a5700; --warn-soft:#fbead1; --bad:#b0281f; --bad-soft:#f7dcd8;
  --info:#2c56a3; --info-soft:#dfe7f6; --idle:#8a9893;
  --f-ui:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --surface-2:#202a26; --line:#2d3934; --fg:#e4ebe8; --muted:#97a6a0;
  --accent:#5fc3a9; --accent-fg:#0b1a16; --accent-soft:#1b3830;
  --ok:#62cf90; --ok-soft:#163222; --warn:#f0b25e; --warn-soft:#3a2a12; --bad:#f2877c; --bad-soft:#3d1c18;
  --info:#91b1f0; --info-soft:#1b2741; --idle:#5f6e69; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --surface-2:#202a26; --line:#2d3934; --fg:#e4ebe8; --muted:#97a6a0;
  --accent:#5fc3a9; --accent-fg:#0b1a16; --accent-soft:#1b3830;
  --ok:#62cf90; --ok-soft:#163222; --warn:#f0b25e; --warn-soft:#3a2a12; --bad:#f2877c; --bad-soft:#3d1c18;
  --info:#91b1f0; --info-soft:#1b2741; --idle:#5f6e69; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:15.5px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--bad);color:var(--surface)}
.who{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.who i{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}

.sync{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.sync.ok{background:var(--ok-soft);color:var(--ok)} .sync.warn{background:var(--warn-soft);color:var(--warn)} .sync.bad{background:var(--bad-soft);color:var(--bad)}
.by{color:var(--muted)}
.demo.ro{background:var(--surface-2);color:var(--muted)}
body.ro .row .btns,body.ro .row .stepper button{opacity:.45;pointer-events:none}
main{padding-block:20px 60px}
.demo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--info-soft);color:var(--info);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.demo b{font-weight:600}
.demo button{margin-left:auto}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.lnk{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}

/* overview */
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:24px;letter-spacing:-.015em}
.head p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.sect{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.sect h2{font-size:15px}
.sect span{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent)}
.card .t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card .t b{font-size:14.5px;line-height:1.3}
.card .sheet{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.card .m{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.card .m strong{color:var(--fg);font-weight:600}
.state{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.state.run{background:var(--warn-soft);color:var(--warn)} .state.done{background:var(--ok-soft);color:var(--ok)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .warn{background:var(--warn)} .bar .bad{background:var(--bad)} .bar .info{background:var(--info)}
.card .f{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.card .f .gap{color:var(--warn)}

/* unit view */
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--accent)}
.uhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:14px}
.uhead h1{font-size:23px;letter-spacing:-.015em}
.uhead p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.prog{min-width:260px}
.prog .nums{display:flex;gap:12px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.prog .nums b{color:var(--fg)}
.prog .big{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.prog .big b{font-size:17px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.team{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.lbl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.in{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px 6px 4px 10px;font-size:13px}
.chip button{border:0;background:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.chips .in{flex:1;min-width:140px}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools .search{flex:1 1 240px;max-width:380px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg em{font-style:normal;font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}

.grp{display:flex;align-items:center;gap:10px;padding:14px 2px 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));background:var(--bg);z-index:5}
.grp b{font-size:14px}
.grp span{font-size:12.5px;color:var(--muted)}
.grp.none b{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 150px 64px 128px 150px 196px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:6px;padding:10px 12px}
.row.r-du{border-left-color:var(--ok)} .row.r-thieu,.row.r-thua{border-left-color:var(--warn)} .row.r-nf{border-left-color:var(--bad)} .row.r-hoso{border-left-color:var(--info)}
.row.r-du,.row.r-hoso{background:color-mix(in srgb,var(--surface) 92%,var(--ok-soft))}
.row .lbl{display:none}
.c-id{display:flex;flex-direction:column;gap:2px}
.c-id .stt{font-size:11.5px;color:var(--muted)}
.c-id .ma{font-size:13px;font-weight:500}
.c-name .nm{font-weight:500;line-height:1.35}
.c-name .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--surface-2);color:var(--muted)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.more{margin-top:8px;display:grid;gap:6px;font-size:12.5px}
.more .full{color:var(--muted);background:var(--surface-2);padding:6px 8px;border-radius:5px}
.c-book{text-align:center}
.c-book b{font-size:16px;font-variant-numeric:tabular-nums}
.stepper{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface-2);width:34px;font-size:17px;line-height:1}
.stepper input{border:0;width:100%;min-width:0;text-align:center;font-weight:600;font-size:15px;padding:6px 2px;background:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.c-act{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.c-act .btns{display:flex;gap:6px}
.c-act .btns .btn{flex:1}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;text-align:center;background:var(--surface-2);color:var(--muted)}
.badge.du{background:var(--ok-soft);color:var(--ok)} .badge.thieu,.badge.thua{background:var(--warn-soft);color:var(--warn)}
.badge.nf{background:var(--bad-soft);color:var(--bad)} .badge.hoso{background:var(--info-soft);color:var(--info)}
.hoso-note{font-size:12px;color:var(--muted);grid-column:span 2}

.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.ps{display:grid;grid-template-columns:minmax(0,2fr) 110px minmax(0,1fr) 160px auto;gap:10px;align-items:end}
.pslist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.psrow{display:flex;gap:12px;align-items:center;font-size:13.5px;background:var(--surface-2);padding:7px 10px;border-radius:6px;flex-wrap:wrap}
.psrow .grow{flex:1;min-width:0}
.end{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:12px;align-items:center}
.end .k small{display:block;font-size:12px;color:var(--muted)}
.end .k b{font-size:18px;font-variant-numeric:tabular-nums}

/* xác minh */
.xm{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:14px}
.xm.done{border-left-color:var(--ok)}
.xm .ask{font-size:13px;color:var(--muted);margin-top:8px}
.xm .ask b{color:var(--fg)}
.xm .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xm .form .wide{grid-column:1/-1}

/* xuất */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-size:12px;font-weight:600;white-space:nowrap;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.diff{color:var(--warn);font-weight:600}
td.miss{color:var(--bad);font-weight:600}
th .col{display:block;font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13.5px;z-index:50}

/* overview tabs + rooms */
.ovtabs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
.ovtabs .seg button{padding:8px 14px;font-size:14px}
.gsearch{flex:1 1 280px;max-width:460px;margin-left:auto}
.bld{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bld button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 12px;font-size:13px}
.bld button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bld .in{max-width:220px;margin-left:auto}
.bldname{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px;letter-spacing:.02em}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:7px;text-decoration:none;color:inherit;min-width:0}
.room:hover{border-color:var(--accent)}
.room b{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.room .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.room .u{display:flex;gap:4px;flex-wrap:wrap}
.room .u span{font-family:var(--f-mono);font-size:10.5px;background:var(--surface-2);color:var(--muted);padding:1px 5px;border-radius:4px}
.room.done{border-color:var(--ok)}
.room.done .m .st{color:var(--ok);font-weight:600}
.room.none{border-style:dashed}
.room.none b{color:var(--warn)}
.sr{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.srow{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,190px) 140px auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13.5px}
.srow .sub{font-size:12px;color:var(--muted)}
.srow .acts{display:flex;gap:6px;justify-content:flex-end}
.units{display:flex;flex-wrap:wrap;gap:8px}
.ucard{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:6px;padding:8px 12px;font-size:13px;min-width:0}
.ucard b{font-size:13.5px}
.ucard span{color:var(--muted);font-size:12px}
.ucard a{font-size:12.5px;color:var(--accent)}
.armed{background:var(--warn)!important;border-color:var(--warn)!important;color:var(--surface)!important}
.toast{display:flex;gap:14px;align-items:center}
.toast[hidden]{display:none}
/* báo trạng thái 1 giây */
.flash{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px) + 14px);transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;padding:12px 20px 12px 14px;border-radius:10px;background:var(--surface);border:2px solid var(--idle);box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:240px;max-width:calc(100vw - 32px);pointer-events:none;animation:flashIn 1s ease forwards}
.flash[hidden]{display:none}
.flash .fi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;flex:0 0 auto;background:var(--surface-2);color:var(--muted)}
.flash .ft{display:flex;flex-direction:column;min-width:0}
.flash b{font-size:16px;line-height:1.25}
.flash small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.flash.ok{border-color:var(--ok)} .flash.ok .fi{background:var(--ok);color:var(--surface)} .flash.ok b{color:var(--ok)}
.flash.warn{border-color:var(--warn)} .flash.warn .fi{background:var(--warn);color:var(--surface)} .flash.warn b{color:var(--warn)}
.flash.bad{border-color:var(--bad)} .flash.bad .fi{background:var(--bad);color:var(--surface)} .flash.bad b{color:var(--bad)}
.flash.info{border-color:var(--info)} .flash.info .fi{background:var(--info);color:var(--surface)} .flash.info b{color:var(--info)}
@keyframes flashIn{0%{opacity:0;transform:translate(-50%,-8px) scale(.96)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
.row.pulse{animation:rowPulse 1s ease}
@keyframes rowPulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}20%{box-shadow:0 0 0 5px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.row.pulse{animation:none}}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:600;text-decoration:underline;padding:0}
details.panel>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2{font-size:15px}
details.panel>summary span{color:var(--muted);font-size:13px}
details.panel>summary::before{content:"▸";color:var(--muted)}
details.panel[open]>summary::before{content:"▾"}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 10px}
/* 2 nhánh */
.branches{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px;align-items:start}
.branch{min-width:0}
.bhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--fg);margin-bottom:6px}
.bhead h2{font-size:18px;letter-spacing:-.01em}
.bhead span{font-size:12.5px;color:var(--muted)}
.bhead .bnum{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:4px}

.urow.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.upick{border:0;background:none;text-align:left;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}

.urow.on .upick{background:var(--accent-soft)}
.ut{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}

.um{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.um .gap{color:var(--warn)}
.uopen{display:flex;align-items:center;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;border-left:1px solid var(--line);white-space:nowrap}
.uopen:hover{background:var(--surface-2)}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin:8px 0 10px;font-size:13.5px}
.selbar span{flex:1;min-width:0}
.room .u span.on{background:var(--accent);color:var(--accent-fg)}
.glink{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.glink:hover{text-decoration:underline}
.rstrip{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.rchip{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:13px;color:var(--fg);text-decoration:none}
.rchip:hover{border-color:var(--accent);color:var(--accent)}
.rchip em{font-style:normal;font-size:11.5px;color:var(--muted)}
.rchip.none{border-style:dashed;color:var(--warn)}
.rchip.st-done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.rchip.st-done em{color:var(--ok)}
.rchip.st-run{border-color:var(--warn)}
.rchip.st-nf{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.rchip.cur{outline:2px solid var(--accent);outline-offset:1px;font-weight:600}
.rchip .ck{font-weight:700}
.nfdot{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:10.5px;font-weight:700}
.striphead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.striphead .lbl{flex:1;min-width:200px}
.roomsel.need{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.warnlbl{color:var(--warn)!important}
.newroom{display:flex;gap:6px}

function shortName(s){
  let t=s.replace(/^\s*[A-ZĐ][A-Za-zĐ_]*[-_ ]?[A-Z]*\s*[:\-]\s*/,'');

  t=t.replace(/^\s*[A-Za-z]+\d{1,3}\s*[-.]\s*/,'');
  t=t.replace(/[\s\-_.]*(CT|CTCT)?\d{5,}\s*$/,'').replace(/[\s\-]+CT\d*\s*$/,'').replace(/[\s\-_.]+$/,'');
  return t.trim()||s;
}

const KEY='kiemke2026.v1';
function blank(){return {rows:{},units:{},xm:{},ps:{},demo:false};}
let S = blank();
/* Chế độ lưu: 'connecting' → 'shared' (dữ liệu chung trên artifact, mọi tổ thấy nhau) hoặc 'local' (chỉ trình duyệt này) */
let MODE='connecting', DB=null, USER=null, ME=null, READONLY=false, READY=false, SLOW=false, SYNCERR=false, MIGRATE=null;
let NAMES={};
const COLS=['rows','xm','units','ps'];

const WR={busy:new Set(),next:new Map()};        // hàng đợi ghi: mỗi tài liệu một lần ghi tại một thời điểm
const LOADED=new Set();
function loadLocal(){ try{const v=localStorage.getItem(KEY); if(v) return JSON.parse(v);}catch(e){} return null; }
function saveLocal(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function docBody(col,v){ return col==='ps'?{items:v}:v; }
function fromBody(col,d){ return col==='ps'?(Array.isArray(d.items)?d.items:[]):d; }
function desired(){ const m={}; COLS.forEach(c=>Object.entries(S[c]||{}).forEach(([k,v])=>{ if(v!=null) m[c+'/'+k]=JSON.stringify(docBody(c,v)); })); return m; }
function restoreFromLast(){ S=blank(); for(const p in LAST){ const [c,k]=p.split('/'); S[c][k]=fromBody(c,JSON.parse(LAST[p])); } }
function save(){
  if(MODE==='local'){ saveLocal(); return; }
  if(MODE!=='shared'||!READY) return;
  if(READONLY){ restoreFromLast(); toast('Bạn chỉ có quyền xem, thay đổi không được lưu'); return; }
  const want=desired();
  for(const p in want) if(want[p]!==LAST[p]){ LAST[p]=want[p]; WR.next.set(p,want[p]); }
  for(const p in LAST) if(!(p in want)){ delete LAST[p]; WR.next.set(p,null); }
  kick();
}
function kick(){ for(const p of WR.next.keys()){ if(WR.busy.size>=6) break; if(!WR.busy.has(p)) runWrite(p); } setSync(); }
async function runWrite(p){
  const json=WR.next.get(p); WR.next.delete(p); WR.busy.add(p);
  for(let i=0;i<3;i++){
    try{ const ref=DB.doc(p); if(json==null) await ref.delete(); else await ref.set(JSON.parse(json)); SYNCERR=false; break; }
    catch(e){
      const c=e&&e.code;
      if((c==='unavailable'||c==='resource_exhausted')&&i<2){ await new Promise(r=>setTimeout(r,600+Math.random()*1200*(i+1))); continue; }
      writeFailed(c); break;
    }
  }
  WR.busy.delete(p); kick();
}
function writeFailed(c){
  SYNCERR=true;
  if(c==='invalid_argument'){ READONLY=true; document.body.classList.add('ro'); toast('Không lưu được: bạn chỉ có quyền xem trang này'); }
  else if(c==='quota_exceeded') toast('Bộ nhớ dữ liệu chung đã đầy, không lưu thêm được');
  else toast('Chưa lưu được lên dữ liệu chung. Kiểm tra mạng rồi thao tác lại.');
}
function setSync(){
  const el=document.getElementById('sync'); if(!el) return;
  let t,k;
  if(MODE==='connecting'||(MODE==='shared'&&!READY)){ t=SLOW?'Chưa kết nối được':'Đang kết nối…'; k=SLOW?'bad':'idle'; }
  else if(MODE==='local'){ t='Chỉ lưu trên máy này'; k='warn'; }
  else if(READONLY){ t='Chỉ xem'; k='idle'; }
  else if(WR.busy.size||WR.next.size){ t='Đang lưu…'; k='idle'; }
  else if(SYNCERR){ t='Lỗi lưu'; k='bad'; }
  else if(SLOW){ t='Số liệu có thể chưa mới'; k='warn'; }

function listen(col){
  DB.collection(col).onSnapshot(snap=>{
    const changed=[];
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id, p=col+'/'+id;
      if(WR.busy.has(p)||WR.next.has(p)) return;          // đang ghi bản mới hơn của chính mình
      if(ch.type==='removed'){ if(p in LAST||S[col][id]){ delete LAST[p]; delete S[col][id]; changed.push(id); } return; }
      const j=JSON.stringify(ch.doc.data()||{}); if(LAST[p]===j) return;
      LAST[p]=j; S[col][id]=fromBody(col,JSON.parse(j)); changed.push(id);
    });
    if(!snap.metadata.fromCache&&!LOADED.has(col)){ LOADED.add(col); if(LOADED.size===COLS.length){ SLOW=false; if(READY) setSync(); else ready(); } }
    if(changed.length) onRemote(col,changed);
  }, ()=>{ SYNCERR=true; setSync(); });
}

function busyEditing(){ const a=document.activeElement; return !!(a&&app.contains(a)&&(a.tagName==='SELECT'||a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['search','checkbox','button'].includes(a.type)))); }
function flushRemote(){

function filtered(list){
  const q=ui.q.trim().toLowerCase();
  return list.filter(a=>{
    const r=res(a);
    if(ui.filter==='chua'&&r!=='chua') return false;
    if(ui.filter==='du'&&!(r==='du'||r==='hoso')) return false;
    if(ui.filter==='lech'&&!(r==='thieu'||r==='thua')) return false;
    if(ui.filter==='nf'&&r!=='nf') return false;
    if(V.type==='room'&&ui.unit&&a.unit!==ui.unit) return false;
    if(q && !(a.ten.toLowerCase().includes(q)||String(a.ma).includes(q)||roomOf(a).toLowerCase().includes(q))) return false;
    return true;
  });
}
function listBody(list,groupBy){

function endHTML(c,us,ps){

/* ---------- router ---------- */
function currentList(){ return V.type==='unit'?BY_UNIT[V.id]:V.type==='room'?roomAssets(V.id):null; }
function render(){ if(MODE==='connecting'||(MODE==='shared'&&!READY)){ app.innerHTML=`<div class="empty" style="margin-top:40px">Đang tải kết quả kiểm kê chung…</div>`; return; } if(V.type==='unit') viewUnit(V.id); else if(V.type==='room') viewRoom(V.id); else if(V.type==='xm') viewXM(); else if(V.type==='xuat') viewXuat(); else viewOverview(); }
function route(){
  const h=(location.hash||'#tong-quan').slice(1);
  const nv = h.startsWith('dv-')?{type:'unit',id:h.slice(3)}:h.startsWith('phong-')?{type:'room',id:h.slice(6)}:h==='xac-minh'?{type:'xm'}:h==='xuat'?{type:'xuat'}:{type:'ov'};
  if(nv.type!==V.type||nv.id!==V.id){ ui={filter:'all',q:pendingQ||'',group:true,open:{},unit:(nv.type==='room'&&pendingU&&UNIT[pendingU])?pendingU:''}; pendingQ=''; pendingU=''; if(nv.type!=='ov') window.scrollTo(0,0); }
  V=nv;
  document.querySelectorAll('#nav a').forEach(a=>a.toggleAttribute('aria-current',false));
  const cur=(V.type==='unit'||V.type==='room')?'tong-quan':h;
  const nav=document.querySelector(`#nav a[data-r="${cur}"]`); if(nav) nav.setAttribute('aria-current','page');
  render(); updateBadge();
}
function updateBadge(){const n=xmPending();const b=document.getElementById('xmCount');b.textContent=n;b.hidden=!n;}

function refreshRow(stt){
  const el=app.querySelector(`.row[data-stt="${stt}"]`); if(el){ el.outerHTML=rowHTML(BY_STT[stt]); }
  const sp=document.getElementById('strip'); const su=V.type==='unit'?V.id:ui.unit; if(sp&&su) sp.innerHTML=stripHTML(su,V.type==='room'?V.id:'');
  const list=currentList(); if(!list) return;
  const c=count(list); const p=document.getElementById('prog'); if(p) p.innerHTML=progHTML(c);
  app.querySelectorAll('.grp[data-g]').forEach(g=>{ const k=g.dataset.g, by=g.dataset.by; const sub=filtered(list).filter(a=>by==='unit'?a.unit===k:roomOf(a)===k); const cc=count(sub); g.querySelector('span').textContent=`${sub.length} dòng · ${cc.chua} chưa kiểm`; });
  if(V.type==='unit'){ const e=document.getElementById('endbox'); if(e) e.innerHTML=endHTML(c,unitState(V.id),S.ps[V.id]||[]); }
  const F={all:c.tong,chua:c.chua,du:c.du+c.hoso,lech:c.lech,nf:c.nf};
  app.querySelectorAll('[data-filter]').forEach(b=>b.querySelector('em').textContent=F[b.dataset.filter]);
  const bb=app.querySelector('[data-act="bulk"]'); if(bb){ const n=bulkCandidates().length; if(!n) bb.remove(); else if(!ui.bulkArm) bb.textContent=`Đủ tất cả còn lại (${n})`; }
  updateBadge();
}
/* đổi phòng: lưu, dựng lại danh sách để tài sản nhảy sang đúng nhóm phòng, cho phép hoàn tác */
function moveRoom(stt,val){
  const a=BY_STT[stt]; const from=roomOf(a); if(val===from){ refreshRow(stt); return; }
  snap([stt]); const r=touch(stt); r.phong=val;
  save(); refreshRooms();
  const y=window.scrollY; render(); window.scrollTo(0,y);
  flash('info','→',val?`Đã chuyển vào ${val}`:'Đã bỏ vị trí',`${a.ma||'STT '+a.stt} · ${a.short}${from?' · trước đó: '+from:''}`);
  toast('Bấm Hoàn tác nếu chọn nhầm phòng',true);
}
function touch(stt){ const r=S.rows[stt]||(S.rows[stt]={}); r.at=Date.now(); if(WEB&&!ME&&!touch.asked){ touch.asked=true; askName(); } if(ME) r.by=ME; unitState(BY_STT[stt].unit).started=true; return r; }
function refocusAfter(id,fn){ const el=document.getElementById(id); const pos=el?el.selectionStart:null; fn(); const n=document.getElementById(id); if(n){ n.focus(); if(pos!=null) try{n.setSelectionRange(pos,pos);}catch(e){} } }

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-filter],[data-sel],[data-bld]'); if(!b) return;
  if(b.dataset.sel!=null){ OV.sel=(OV.sel===b.dataset.sel)?'':b.dataset.sel; viewOverview(); if(OV.sel&&window.innerWidth<980) document.getElementById('b2').scrollIntoView({block:'start'}); return; }
  if(b.dataset.bld){ OV.bld=b.dataset.bld; viewOverview(); return; }
  if(b.dataset.filter){ ui.filter=b.dataset.filter; ui.bulkArm=false; render(); return; }
  const act=b.dataset.act; const row=b.closest('[data-stt]'); const stt=row?+row.dataset.stt:null; const a=stt?BY_STT[stt]:null;
  if(act==='goto'){ pendingQ=b.dataset.q||''; pendingU=b.dataset.u||''; return; }
  if(act==='unitall'){ ui.unit=''; render(); return; }
  if(act==='migrate'&&MIGRATE){ const L=MIGRATE; let n=0;
    Object.entries(L.rows||{}).forEach(([k,v])=>{ if(v&&!S.rows[k]){ S.rows[k]=Object.assign({},v,ME?{by:ME}:{}); n++; } });
    Object.entries(L.xm||{}).forEach(([k,v])=>{ if(v&&!S.xm[k]) S.xm[k]=v; });
    Object.entries(L.units||{}).forEach(([k,v])=>{ if(v&&!S.units[k]) S.units[k]=v; });
    Object.entries(L.ps||{}).forEach(([k,v])=>{ if(Array.isArray(v)&&v.length) S.ps[k]=(S.ps[k]||[]).concat(v); });
    MIGRATE=null; try{ localStorage.setItem(KEY+'.moved','1'); }catch(e){}
    save(); refreshRooms(); render(); updateBadge(); toast(`Đã đưa ${n} kết quả lên dữ liệu chung${Object.keys(L.rows||{}).length>n?' (bỏ qua món đã có người kiểm)':''}`); return; }
  if(act==='nomigrate'){ MIGRATE=null; try{ localStorage.setItem(KEY+'.moved','1'); }catch(e){} render(); return; }
  if(act==='reset'){ if(MODE!=='local') return; S=blank(); save(); refreshRooms(); route(); toast('Đã xoá dữ liệu mẫu'); return; }
  if(act==='more'){ ui.open[stt]=!ui.open[stt]; refreshRow(stt); return; }
  if(act==='bulk'){
    if(!ui.bulkArm){ ui.bulkArm=true; b.classList.add('armed'); b.textContent=`Bấm lần nữa: đánh dấu đủ ${bulkCandidates().length} món`; clearTimeout(ui._arm); ui._arm=setTimeout(()=>{ui.bulkArm=false; const x=app.querySelector('[data-act="bulk"]'); if(x){x.classList.remove('armed'); x.textContent=`Đủ tất cả còn lại (${bulkCandidates().length})`;}},4000); return; }
    const list=bulkCandidates(); snap(list.map(x=>x.stt));
    list.forEach(x=>{ const r=touch(x.stt); r.tt=x.sl; r.nf=false; if(r.phong==null) r.phong=roomOf(x); if(!r.cond) r.cond='tot'; });
    ui.bulkArm=false; save(); render(); flash('ok','✓',`Đã kiểm đủ ${list.length} món`,V.type==='room'?ROOMNAME[V.id]||'':UNIT[V.id]?.ten||''); toast('Bấm Hoàn tác nếu đánh dấu nhầm',true); return;
  }
  if(['du','nf','hoso','inc','dec','clr','here'].includes(act)) snap([stt]);
  if(act==='du'){ const r=touch(stt); r.tt=a.sl; r.nf=false; if(r.phong==null) r.phong=a.vt0; if(!r.cond) r.cond='tot'; }
  if(act==='nf'){ const r=touch(stt); if(r.nf){ r.nf=false; r.tt=null; delete S.xm[stt]; save(); refreshRow(stt); flashRes(stt); return; } else { r.nf=true; r.tt=0; if(!S.xm[stt]) S.xm[stt]={kq:'cho',cach:''}; save(); refreshRow(stt); flashRes(stt); toast('Bấm Hoàn tác nếu đánh dấu nhầm',true); return; } }
  if(act==='hoso'){ const r=touch(stt); r.hs=!r.hs; }
  if(act==='clr'){ delete S.rows[stt]; delete S.xm[stt]; save(); refreshRow(stt); flashRes(stt); toast('Bấm Hoàn tác để lấy lại kết quả cũ',true); return; }
  if(act==='inc'||act==='dec'){ const r=touch(stt); if(r.tt==null||r.tt===''){ r.tt=a.sl; } else r.tt=Math.max(0,+r.tt+(act==='inc'?1:-1)); r.nf=false; if(r.phong==null) r.phong=a.vt0; }
  if(['du','hoso','inc','dec'].includes(act)){ save(); refreshRow(stt); flashRes(stt); return; }
  if(act==='saveroom'){ const v=(document.getElementById('nr-'+stt)?.value||'').trim(); if(!v){ toast('Nhập tên phòng trước khi lưu'); return; } delete ui.newRoom[stt]; moveRoom(stt,v); return; }
  if(act==='cancelroom'){ delete ui.newRoom[stt]; refreshRow(stt); return; }
  if(act==='here'){ const name=ROOMNAME[V.id]; const from=roomOf(a); const r=touch(stt); r.phong=name; if(from&&from!==name) r.note=((r.note?r.note+'; ':'')+'Thấy ở '+name+', sổ ghi '+from); save(); refreshRooms(); render(); flash('info','→',`Đã ghi nhận ở ${name}`,`${a.ma||'STT '+a.stt} · ${a.short}`); toast('Bấm Hoàn tác nếu ghi nhầm',true); return; }
  if(act==='rmcb'){ unitState(V.id).canbo.splice(+b.dataset.i,1); save(); render(); return; }
  if(act==='rmps'){ S.ps[psKey()].splice(+b.dataset.i,1); save(); render(); return; }
  if(act==='end'){ const us=unitState(V.id); us.ended=!us.ended; save(); render(); toast(us.ended?'Đã kết thúc buổi kiểm kê':'Đã mở lại buổi'); return; }
  if(act==='recheck'){ const x=S.xm[stt]; const r=touch(stt); r.nf=false; r.tt=null; if(x.phong) r.phong=x.phong; save(); refreshRooms(); pendingQ=a.ma; location.hash='phong-'+slugify(roomOf(a)); return; }
  if(act==='copy'){
    const rows=exportRows(); const head=['STT','Mã TSCĐ','Tên TSCĐ','Sổ sách','Thực tế','Ngày bắt đầu SD','Nguyên giá','Ghi chú','Vị trí'];
    const txt=[head.join('\t')].concat(rows.map(a=>[a.stt,a.ma,a.ten,a.sl,cellE(a),dmy(a.ngay),a.gia,a.gc,roomOf(a)].map(v=>String(v??'').replace(/[\t\n]/g,' ')).join('\t'))).join('\n');
    if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(txt).then(()=>toast(`Đã sao chép ${rows.length} dòng. Mở Excel và dán.`),()=>toast('Trình duyệt chặn sao chép. Hãy chọn bảng rồi Ctrl+C.')); }
    else toast('Trình duyệt chặn sao chép. Hãy chọn bảng rồi Ctrl+C.');
  }
});
app.addEventListener('change',e=>{
  const t=e.target; const row=t.closest('[data-stt]'); const stt=row?+row.dataset.stt:null;
  if(t.dataset.f==='phong' && stt){
    if(t.value==='__new'){ (ui.newRoom=ui.newRoom||{})[stt]=true; refreshRow(stt); const n=document.getElementById('nr-'+stt); if(n) n.focus(); return; }
    moveRoom(stt,t.value); return;
  }
  if(t.dataset.f && stt){
    const r=touch(stt); const a=BY_STT[stt];
    if(t.dataset.f==='tt'){ snap([stt]); r.tt=t.value===''?null:Math.max(0,+t.value); r.nf=false; if(r.phong==null) r.phong=a.vt0; }
    else r[t.dataset.f]=t.value.trim?t.value.trim():t.value;
    save(); if(t.dataset.f==='phong') refreshRooms();
    if(t.dataset.f!=='note') refreshRow(stt);
    if(t.dataset.f==='tt') flashRes(stt);
    if(t.dataset.f==='cond'&&t.value){ const lb=(COND.find(c=>c[0]===t.value)||[])[1]; flash(t.value==='tot'?'ok':'warn',t.value==='tot'?'✓':'!',`Tình trạng: ${lb}`,`${a.ma||'STT '+a.stt} · ${a.short}`); }
    return;
  }
  if(t.dataset.x && stt){ const x=S.xm[stt]||(S.xm[stt]={kq:'cho'}); x[t.dataset.x]=t.value; x.at=Date.now(); if(ME) x.by=ME;
    if(t.dataset.x==='kq'){ const r=S.rows[stt]||(S.rows[stt]={});
      if(t.value==='thay'){ r.nf=false; r.tt=BY_STT[stt].sl; }
      else if(t.value==='hong'){ r.cond='thanh_ly'; }
    }
    save(); viewXM(); updateBadge(); return; }
  if(t.dataset.u){ unitState(V.id)[t.dataset.u]=t.value; save(); return; }
  if(t.id==='grp'){ ui.group=t.checked; render(); return; }
  if(t.id==='u-sign'){ unitState(V.id).signed=t.checked; save(); return; }
  if(t.id==='xu'){ xuatUnit=t.value; viewXuat(); return; }
  if(t.id==='hideDone'){ OV.hideDone=t.checked; document.getElementById('roomgrid').innerHTML=ovRoomsHTML(); return; }
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ ui.q=t.value; ui.bulkArm=false; clearTimeout(app._q); app._q=setTimeout(()=>refocusAfter('q',()=>{ const l=currentList(); document.getElementById('rows').innerHTML=l.length?listBody(l,V.type==='unit'?'room':'unit'):''; refreshRow(-1); }),200); }
  if(t.id==='gq'){ OV.gq=t.value; clearTimeout(app._g); app._g=setTimeout(()=>document.getElementById('gres').innerHTML=ovSearchHTML(),200); }
  if(t.id==='rq'){ OV.rq=t.value; clearTimeout(app._r); app._r=setTimeout(()=>document.getElementById('roomgrid').innerHTML=ovRoomsHTML(),150); }
  if(t.id==='aq'){ clearTimeout(app._a); app._a=setTimeout(()=>{ const q=t.value.trim().toLowerCase(); const box=document.getElementById('ares'); if(q.length<2){box.innerHTML='';return;}
      const name=ROOMNAME[V.id]; const hits=ASSETS.filter(a=>roomOf(a)!==name&&(a.ten.toLowerCase().includes(q)||String(a.ma).includes(q))).slice(0,25);
      box.innerHTML=hits.length?hits.map(a=>srow(a,name)).join(''):`<div class="empty">Không tìm thấy “${esc(t.value)}”. Nếu là đồ không có trong sổ, ghi vào Tài sản phát sinh.</div>`; },200); }
  if(t.dataset.f==='note'){ const stt=+t.closest('[data-stt]').dataset.stt; touch(stt).note=t.value; save(); }
});
app.addEventListener('keydown',e=>{
  if(e.target.id==='u-cb' && e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(!v) return; unitState(V.id).canbo.push(v); save(); render(); document.getElementById('u-cb').focus(); }
  // Enter trong ô tìm: nếu chỉ còn 1 món chưa kiểm thì đánh dấu đủ luôn
  if(e.target.id==='q' && e.key==='Enter'){ e.preventDefault(); const l=filtered(currentList()||[]).filter(a=>res(a)==='chua'&&!a.hoso); if(l.length===1){ const a=l[0]; snap([a.stt]); const r=touch(a.stt); r.tt=a.sl; r.nf=false; if(r.phong==null) r.phong=roomOf(a); if(!r.cond) r.cond='tot'; save(); refreshRow(a.stt); flashRes(a.stt); toast('Bấm Hoàn tác nếu đánh dấu nhầm',true); e.target.select(); } else if(l.length>1){ flash('warn','?',`Còn ${l.length} món khớp`,'Gõ thêm để chỉ còn 1 món rồi nhấn Enter'); } else { flash('bad','×','Không có món chưa kiểm nào khớp',e.target.value); } }
});
app.addEventListener('submit',e=>{
  if(e.target.id!=='psForm') return; e.preventDefault();
  const k=psKey(); (S.ps[k]=S.ps[k]||[]).push({mo_ta:document.getElementById('ps-mt').value.trim(),sl:+document.getElementById('ps-sl').value||1,phong:document.getElementById('ps-ph').value.trim(),cond:document.getElementById('ps-cd').value});
  save(); render(); toast('Đã thêm tài sản phát sinh');
});

function setTopH(){document.documentElement.style.setProperty('--toph',document.getElementById('top').offsetHeight+'px');}
window.addEventListener('resize',setTopH);
window.addEventListener('hashchange',route);
app.addEventListener('focusout',()=>setTimeout(()=>{ if(RQ.wait&&!busyEditing()) flushRemote(); },60));
window.addEventListener('beforeunload',e=>{ if(WR.busy.size||WR.next.size){ e.preventDefault(); e.returnValue=''; } });
setTopH(); refreshRooms(); init();
</script>

</body></html>
